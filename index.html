<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>市场部会议可视化</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Market Activity Calendar</p>
          <h1>市场部会议可视化</h1>
        </div>
        <div class="sync-panel">
          <span id="syncStatus" class="sync-dot"></span>
          <span id="lastUpdated">正在读取数据</span>
        </div>
      </header>

      <section class="toolbar" aria-label="筛选条件">
        <div class="month-switch">
          <button id="prevMonth" type="button" aria-label="上一期">‹</button>
          <strong id="currentMonth"></strong>
          <button id="nextMonth" type="button" aria-label="下一期">›</button>
        </div>
        <div class="view-switch" aria-label="视图切换">
          <button id="monthView" type="button" class="active">月历</button>
          <button id="yearView" type="button">年度</button>
          <button id="summaryView" type="button">汇总</button>
        </div>
        <label>
          <span>区域</span>
          <select id="regionFilter"></select>
        </label>
        <label>
          <span>状态</span>
          <select id="statusFilter"></select>
        </label>
        <label>
          <span>项目类型</span>
          <select id="typeFilter"></select>
        </label>
        <label>
          <span>负责人</span>
          <select id="ownerFilter"></select>
        </label>
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="会议 / 嘉宾 / 地点 / 编号" />
        </label>
      </section>

      <section class="summary-strip" id="summaryStrip" aria-label="会议统计"></section>

      <section id="calendarPanel" class="calendar-panel">
        <div class="weekday-row" aria-hidden="true">
          <span>周一</span>
          <span>周二</span>
          <span>周三</span>
          <span>周四</span>
          <span>周五</span>
          <span>周六</span>
          <span>周日</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section id="yearPanel" class="year-panel" aria-label="年度视图" hidden>
        <div id="yearGrid" class="year-grid"></div>
      </section>

      <section id="summaryPanel" class="analysis-panel" aria-label="汇总" hidden>
        <div id="analysisGrid" class="analysis-grid"></div>
      </section>

      <section class="all-events-panel" aria-label="全部会议">
        <div class="panel-heading">
          <h2>全部会议</h2>
          <div class="panel-actions" id="eventDataTools">
            <button id="addEventButton" type="button" class="secondary-button">新增会议</button>
            <input id="eventImportInput" type="file" accept=".xlsx,.xlsm" hidden />
            <button id="eventImportButton" type="button" class="secondary-button">导入会议Excel</button>
            <a id="eventExportButton" class="secondary-button" href="/api/export-events" target="_blank" rel="noreferrer">导出会议Excel</a>
          </div>
          <span id="allEventsCount"></span>
        </div>
        <div id="allEventsList" class="all-events-list"></div>
      </section>
    </main>

    <aside id="detailDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-scrim" id="drawerScrim"></div>
      <article class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <button id="closeDrawer" type="button" class="close-button" aria-label="关闭">×</button>
        <div id="detailContent"></div>
      </article>
    </aside>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <h2>当前筛选下没有会议</h2>
        <p>保存 Excel 或调整筛选后，页面会自动重新读取。</p>
      </div>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
